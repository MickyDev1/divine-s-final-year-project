<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Planck Spectral Energy Density</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        color: #1f2937;
        background: #f5f7fb;
      }

      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 32px 20px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 30px;
      }

      p {
        max-width: 850px;
        line-height: 1.6;
      }

      img {
        display: block;
        width: 100%;
        height: auto;
        margin-top: 24px;
        border: 1px solid #d8dee9;
        background: white;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Planck Spectral Energy Density</h1>
      <p>
        The plot shows Planck's spectral energy density for 3000 K, 4000 K,
        and 5000 K from 100 nm to 3000 nm. As temperature increases, the peak
        becomes higher and shifts toward shorter wavelengths.
      </p>
      <img
        src="planck_spectral_energy_density.png"
        alt="Planck spectral energy density plot for 3000 K, 4000 K, and 5000 K"
      >
    </main>
  </body>
</html>
